      {

      {

        options: [

        answer: "A",
        explanation: "李澤藩感念恩師培育，將長子取名「遠川」（取石川之川），三子取名「遠欽」（取欽一郎之欽），展現深厚師生之情。"

    // State Variables
    let currentIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    let isShowingReview = false;

    // DOM Elements
    const questionTextEl = document.getElementById('question-text');
    const questionCatEl = document.getElementById('question-category');
    const optionsContainerEl = document.getElementById('options-container');
    const explanationBoxEl = document.getElementById('explanation-box');
    const explanationTextEl = document.getElementById('explanation-text');
    const resultTitleEl = document.getElementById('result-title');
    const resultIconEl = document.getElementById('result-icon');
    const currentQLabelEl = document.getElementById('current-q-label');
    const jumpGridEl = document.getElementById('jump-grid');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const finishBtn = document.getElementById('finish-btn');
    const progressBar = document.getElementById('progress-bar');
    const answeredCountEl = document.getElementById('answered-count');

    const quizView = document.getElementById('quiz-view');
    const resultView = document.getElementById('result-view');
    const finalScoreEl = document.getElementById('final-score');
    const correctCountEl = document.getElementById('correct-count');
    const incorrectCountEl = document.getElementById('incorrect-count');
    const accuracyRateEl = document.getElementById('accuracy-rate');
    const badgeTitleEl = document.getElementById('badge-title');
    const badgeDescEl = document.getElementById('badge-desc');
    const restartBtn = document.getElementById('restart-btn');
    const toggleReviewBtn = document.getElementById('toggle-review-btn');
    const reviewListEl = document.getElementById('review-list');
    const reviewCardsEl = document.getElementById('review-cards');

    // Initialize Navigator Grid
    function renderJumpGrid() {
      jumpGridEl.innerHTML = '';
      quizData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.textContent = idx + 1;
        btn.id = `jump-btn-${idx}`;
        btn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-xs font-semibold flex items-center justify-center transition-all border ${getJumpBtnClass(idx)}`;
        btn.onclick = () => jumpToQuestion(idx);
        jumpGridEl.appendChild(btn);
      });
    }

    function getJumpBtnClass(idx) {
      const isCurrent = idx === currentIndex;
      const ans = userAnswers[idx];

      if (ans === null) {
        return isCurrent
          ? 'bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-200'
          : 'bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100';
      }

      const isCorrect = ans === quizData[idx].answer;
      if (isCurrent) {
        return isCorrect
          ? 'bg-emerald-600 text-white border-emerald-600 ring-2 ring-emerald-200'
          : 'bg-rose-600 text-white border-rose-600 ring-2 ring-rose-200';
      }

      return isCorrect
        ? 'bg-emerald-100 text-emerald-800 border-emerald-300 font-bold'
        : 'bg-rose-100 text-rose-800 border-rose-300 font-bold';
    }

    // Load Specific Question
    function loadQuestion(idx) {
      currentIndex = idx;
      const q = quizData[idx];

      currentQLabelEl.textContent = `第 ${idx + 1} 題 / 共 20 題`;
      questionCatEl.textContent = q.category;
      questionTextEl.textContent = `${idx + 1}. ${q.question}`;

      // Update progress indicators
      const answeredTotal = userAnswers.filter(a => a !== null).length;
      answeredCountEl.textContent = answeredTotal;
      progressBar.style.width = `${((idx + 1) / quizData.length) * 100}%`;

      // Render Options
      optionsContainerEl.innerHTML = '';
      const answered = userAnswers[idx] !== null;
      const chosen = userAnswers[idx];

      q.options.forEach(opt => {
        const optBtn = document.createElement('button');
        optBtn.className = `w-full text-left p-3.5 sm:p-4 rounded-2xl border text-sm sm:text-base font-medium transition-all flex items-start space-x-3.5 ${getOptionStyle(opt.key, chosen, q.answer, answered)}`;
        optBtn.disabled = answered;
        optBtn.onclick = () => selectAnswer(opt.key);

        optBtn.innerHTML = `
          <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border text-xs font-bold mt-0.5 shrink-0 ${getBadgeStyle(opt.key, chosen, q.answer, answered)}">
            ${opt.key}
          </span>
          <span class="leading-relaxed">${opt.text}</span>
        `;
        optionsContainerEl.appendChild(optBtn);
      });

      // Explanation display
      if (answered) {
        showExplanation(chosen === q.answer, q.explanation);
      } else {
        explanationBoxEl.classList.add('hidden');
      }

      // Prev / Next button state
      prevBtn.disabled = idx === 0;

      if (idx === quizData.length - 1) {
        nextBtn.classList.add('hidden');
        finishBtn.classList.remove('hidden');
      } else {
        nextBtn.classList.remove('hidden');
        finishBtn.classList.add('hidden');
      }

      renderJumpGrid();
    }

    function getOptionStyle(key, chosen, correct, answered) {
      if (!answered) {
        return 'border-stone-200 bg-white text-stone-800 hover:border-indigo-300 hover:bg-stone-50';
      }
      if (key === correct) {
        return 'border-emerald-500 bg-emerald-50/80 text-emerald-950 font-semibold ring-1 ring-emerald-400';
      }
      if (key === chosen && key !== correct) {
        return 'border-rose-400 bg-rose-50 text-rose-950 font-semibold';
      }
      return 'border-stone-200 bg-stone-50/60 text-stone-400 opacity-60';
    }

    function getBadgeStyle(key, chosen, correct, answered) {
      if (!answered) {
        return 'border-stone-300 text-stone-500 bg-white';
      }
      if (key === correct) {
        return 'border-emerald-600 bg-emerald-600 text-white';
      }
      if (key === chosen && key !== correct) {
        return 'border-rose-500 bg-rose-500 text-white';
      }
      return 'border-stone-200 text-stone-300 bg-stone-100';
    }

    function showExplanation(isCorrect, text) {
      explanationBoxEl.classList.remove('hidden');
      if (isCorrect) {
        explanationBoxEl.className = 'mt-6 p-4 sm:p-5 rounded-2xl border bg-emerald-50/60 border-emerald-200 text-emerald-900 block';
        resultIconEl.textContent = '✨';
        resultTitleEl.textContent = '回答正確！深度解析';
      } else {
        explanationBoxEl.className = 'mt-6 p-4 sm:p-5 rounded-2xl border bg-rose-50/60 border-rose-200 text-rose-900 block';
        resultIconEl.textContent = '📌';
        resultTitleEl.textContent = '思考指引與正確觀念';
      }
      explanationTextEl.textContent = text;
    }

    function selectAnswer(key) {
      if (userAnswers[currentIndex] !== null) return;
      userAnswers[currentIndex] = key;
      loadQuestion(currentIndex);
    }

    function jumpToQuestion(idx) {
      loadQuestion(idx);
    }

    // Finish & Show Results
    function finishQuiz() {
      quizView.classList.add('hidden');
      resultView.classList.remove('hidden');

      let correct = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].answer) correct++;
      });

      const total = quizData.length;
      const incorrect = total - correct;
      const score = Math.round((correct / total) * 100);

      finalScoreEl.textContent = `${score}分`;
      correctCountEl.textContent = `${correct}題`;
      incorrectCountEl.textContent = `${incorrect}題`;
      accuracyRateEl.textContent = `${score}%`;

      // Badge logic
      if (score === 100) {
        badgeTitleEl.textContent = '提燈引路的台灣水彩先知 🌟';
        badgeDescEl.textContent = '太令人驚嘆！您對石川欽一郎的生平、光影互補用色哲學與日治現代美育脈絡瞭若指掌，堪稱台灣美術史的精闢研究者！';
      } else if (score >= 80) {
        badgeTitleEl.textContent = '山紫水明的風土鑑賞家 🌿';
        badgeDescEl.textContent = '表現極為優異！您已精準掌握石川欽一郎引進戶外寫生、創設台灣水彩畫會及啟蒙前輩畫家的核心精神。';
      } else if (score >= 60) {
        badgeTitleEl.textContent = '白川美學的實踐探索者 🎨';
        badgeDescEl.textContent = '基礎相當扎實！您已理解石川對台灣氣候與水彩特性的觀察，若再補足細節背景，您對台灣美術史的視野將更上層樓。';
      } else {
        badgeTitleEl.textContent = '初探南國水彩的新芽 🌱';
        badgeDescEl.textContent = '藉由這 20 題的題目與詳細解析，您已逐步走進石川欽一郎「用自己的雙手畫自己的鄉土」的美學世界，歡迎重新複習再試一次！';
      }

      buildReviewCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildReviewCards() {
      reviewCardsEl.innerHTML = '';
      quizData.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.answer;

        const card = document.createElement('div');
        card.className = `p-4 sm:p-5 rounded-2xl border ${isCorrect ? 'bg-white border-stone-200' : 'bg-rose-50/40 border-rose-200'}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <span class="text-xs font-semibold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              第 ${idx + 1} 題 ${isCorrect ? '✓ 正確' : '✗ 答錯'}
            </span>
            <span class="text-xs text-stone-400 font-sans">${q.category}</span>
          </div>
          <h4 class="font-serif font-bold text-ink text-sm sm:text-base mb-3 leading-snug">
            ${q.question}
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs mb-3">
            <div class="p-2 rounded-lg ${isCorrect ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-100 text-rose-900 border border-rose-300 font-medium'}">
              您的回答：${userAns ? `${userAns}. ${q.options.find(o => o.key === userAns)?.text}` : '未作答'}
            </div>
            <div class="p-2 rounded-lg bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium">
              正確解答：${q.answer}. ${q.options.find(o => o.key === q.answer)?.text}
            </div>
          </div>
          <p class="text-xs text-stone-600 bg-stone-50 p-2.5 rounded-xl border border-stone-200 leading-relaxed font-sans">
            <strong class="text-stone-700">解析：</strong>${q.explanation}
          </p>
        `;
        reviewCardsEl.appendChild(card);
      });
    }

    // Event Listeners
    prevBtn.onclick = () => {
      if (currentIndex > 0) loadQuestion(currentIndex - 1);
    };

    nextBtn.onclick = () => {
      if (currentIndex < quizData.length - 1) loadQuestion(currentIndex + 1);
    };

    finishBtn.onclick = () => finishQuiz();

    restartBtn.onclick = () => {
      userAnswers.fill(null);
      resultView.classList.add('hidden');
      quizView.classList.remove('hidden');
      loadQuestion(0);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    toggleReviewBtn.onclick = () => {
      reviewListEl.scrollIntoView({ behavior: 'smooth' });
    };

    // Initial load
    renderJumpGrid();
    loadQuestion(0);
  </script>
</body>
</html>
